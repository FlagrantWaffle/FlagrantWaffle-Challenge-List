{% extends "base.html" %}

{% block title %}
Register - FlagrantWaffle
{% endblock %}

{% block content %}

<main class="login-page">

    <section class="login-card">

        <h1>Register</h1>

        <p class="login-subtitle">
            Create an account to submit completions and earn Waffle Points.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" action="/register">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <label for="confirm_password">Confirm Password</label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="/login">Log in</a>
        </p>

    </section>

</main>

{% endblock %}
