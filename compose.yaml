services:

  app:
    build: .
    container_name: flagrantwaffle-app

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      SESSION_HTTPS_ONLY: "true"
      DISCORD_REDIRECT_URI: https://flagrantwaffle.com/auth/discord/callback

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  db:
    image: postgres:18
    container_name: flagrantwaffle-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10


  nginx:
    image: nginx:alpine
    container_name: flagrantwaffle-nginx

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: flagrantwaffle-cloudflared

    restart: unless-stopped

    command: tunnel --no-autoupdate run

    env_file:
      - .env.cloudflared

    depends_on:
      - nginx


volumes:
  postgres_data: