services:
  app:
    build: .
    container_name: flagrantwaffle-app

    env_file:
      - .env

    environment:
      DB_HOST: db

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:18
    container_name: flagrantwaffle-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data: